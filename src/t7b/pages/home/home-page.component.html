<div class="body">
  <app-feature-card
    *ngFor="let featureCard of featureCards"
    [headerText]="featureCard.header"
    [paragraphText]="featureCard.paragraph"
    [buttonText]="featureCard.buttonText"
    [imageUrl]="featureCard.imageUrl"
    [reverse]="featureCard.reverse">
  </app-feature-card>
</div>
