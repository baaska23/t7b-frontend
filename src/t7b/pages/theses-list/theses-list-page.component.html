<div class="theses-page">
    <h2>Theses examples</h2>
    <div class="thesis-cards">
        <app-thesis-card
            *ngFor="let thesis of theses"
            [thesisId]="thesis.thesisId"
            [author]="thesis.author.username"
            [title]="thesis.title"
            [mainField]="thesis.mainField"
            [subField]="thesis.subField"
            [publishedYear]="thesis.publishedYear"
            [school]="thesis.school"
            [grade]="thesis.grade"
            [rating]="thesis.rating"
            (cardClick)="goToThesis($event)"
        ></app-thesis-card>
    </div>
</div>
