<div class="guide-page">
    <div class="guide-list">
        <div class="guide-card">
            <h3>{{ guide.title }}</h3>
            <div class="guide-meta">
                <span>By: {{ guide.uploadedBy?.username }}</span>
                <span>• {{ getMinutesAgo(guide.createdAt) }}</span>
            </div>
            <p class="guide-content">
                {{ guide.content }}
            </p>
            <div class="guide-actions">
                <span>👍 {{ guide.likeCount }}</span>
                <span>👎 {{ guide.dislikeCount }}</span>
            </div>
        </div>
    </div>
</div>
