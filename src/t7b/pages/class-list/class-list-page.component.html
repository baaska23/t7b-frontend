<div class="class-page">
    <h2>My Class</h2>
    <div class="class-cards">
        <app-class-card
            *ngFor="let c of classes"
            [classId]="c.classId"
            [className]="c.className"
            [description]="c.description"
            (cardClick)="goToClass($event)"
        ></app-class-card>
    </div>
</div>
